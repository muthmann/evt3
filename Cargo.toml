[workspace]
resolver = "2"
members = [
    "evt3-core",
    "evt3-cli",
    "evt3-python",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["Mika Uthmann <muthmann@physik.uni-bielefeld.de"]
license = "MIT"
repository = "https://github.com/muthmann/evt3"
homepage = "https://github.com/muthmann/evt3"
description = "High-performance EVT 3.0 raw data decoder for Prophesee event cameras"
readme = "README.md"
keywords = ["event-camera", "evt3", "prophesee", "decoder", "neuromorphic"]
categories = ["parser-implementations", "encoding", "science"]

[workspace.dependencies]
thiserror = "1.0"
byteorder = "1.5"
# Keep this version in step with workspace.package.version above.
# crates.io rejects a publish whose path dependency carries no version.
evt3 = { path = "evt3-core", version = "0.3.0" }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1
