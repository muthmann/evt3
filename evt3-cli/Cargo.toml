[package]
name = "evt3-cli"
version = "0.2.0"
edition = "2021"
authors = ["Mika Uthmann <muthmann@physik.uni-bielefeld.de>"]
license = "MIT"
description = "CLI tool for decoding EVT 3.0 raw files from Prophesee event cameras"
readme = "../README.md"
homepage = "https://github.com/muthmann/evt3"
repository = "https://github.com/muthmann/evt3"
keywords = ["event-camera", "event-based-camera", "evt3", "prophesee", "cli", "decoder"]
categories = ["command-line-utilities", "parser-implementations"]

[[bin]]
name = "evt3"
path = "src/main.rs"

[features]
default = []
hdf5 = ["evt3-core/hdf5"]

[dependencies]
evt3-core = { path = "../evt3-core" }
clap = { version = "4.4", features = ["derive"] }
indicatif = "0.17"
anyhow = "1.0"
