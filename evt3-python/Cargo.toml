[package]
name = "evt3-python"
version = "0.3.0"
edition = "2021"
rust-version = "1.83"
authors = ["Mika Uthmann <muthmann@physik.uni-bielefeld.de>"]
license = "MIT"
description = "Python bindings for EVT 3.0 decoder with zero-copy numpy support"
publish = false

[lib]
# Distinct from the `evt3` library crate this binds, so the dependency stays
# unambiguous. maturin names the Python module from tool.maturin.module-name.
name = "evt3_python"
crate-type = ["cdylib"]

[features]
default = []
hdf5 = ["evt3/hdf5"]

[dependencies]
evt3 = { workspace = true }
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"
