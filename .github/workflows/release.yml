name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build CLI - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: evt3-linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: evt3-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: evt3-macos-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: evt3-macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: evt3-windows-x64.exe

    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Install cross (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --git https://github.com/cross-rs/cross
      
      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }} -p evt3-cli
      
      - name: Build (cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target ${{ matrix.target }} -p evt3-cli
      
      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/evt3 ${{ matrix.name }}
      
      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/evt3.exe ${{ matrix.name }}
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  build-wheels:
    name: Build Python wheels - ${{ matrix.os }} - py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.14t']
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      
      - name: Set up Python
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Build wheels
        working-directory: evt3-python
        run: uv tool run maturin build --release --out dist --interpreter "${{ steps.python.outputs.python-path }}"
      
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
          path: evt3-python/dist/*.whl

  release:
    name: Create Release
    needs: [build-binaries, build-wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/evt3-*/*
            artifacts/wheels-*/*.whl
          generate_release_notes: true

  publish-crates:
    name: Publish to crates.io
    needs: [build-binaries]
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # The evt3 library must land first: evt3-cli depends on it by version,
      # so the CLI cannot be packaged until the library is in the index.
      # `cargo publish` already blocks until the new version is readable from
      # the index, so no separate wait step is needed between the two.
      #
      # Idempotency is checked against the sparse index, not `cargo search`.
      # `cargo search` queries the crates.io search API, which lags behind
      # publication independently and is not a reliable readiness signal.
      - name: Publish evt3 library
        run: |
          version="${GITHUB_REF_NAME#v}"
          if curl -sf https://index.crates.io/ev/t3/evt3 \
              | grep -q "\"vers\":\"$version\""; then
            echo "evt3 $version already published, skipping"
          else
            cargo publish -p evt3
          fi

      - name: Publish evt3-cli
        run: |
          version="${GITHUB_REF_NAME#v}"
          if curl -sf https://index.crates.io/ev/t3/evt3-cli \
              | grep -q "\"vers\":\"$version\""; then
            echo "evt3-cli $version already published, skipping"
          else
            cargo publish -p evt3-cli
          fi

  publish-pypi:
    name: Publish to PyPI
    needs: [build-wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
