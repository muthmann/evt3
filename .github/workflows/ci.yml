name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-tests:
    name: Rust Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Check formatting
        run: cargo fmt --all -- --check
      
      - name: Clippy
        run: cargo clippy --all-targets -p evt3 -p evt3-cli -- -D warnings
      
      - name: Build
        run: cargo build -p evt3 -p evt3-cli
      
      - name: Run unit tests
        run: cargo test -p evt3 --lib

  rust-tests-hdf5:
    name: Rust Tests (HDF5 feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-cargo-hdf5-${{ hashFiles('**/Cargo.lock') }}

      - name: Install HDF5
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev

      - name: Clippy (hdf5 feature)
        run: cargo clippy -p evt3 -p evt3-cli --features hdf5 -- -D warnings

      - name: Run unit tests (hdf5 feature)
        run: cargo test -p evt3 --lib --features hdf5

      - name: Run integration tests (hdf5 feature, synthetic fixtures only)
        run: cargo test -p evt3 --test integration_tests --features hdf5 -- --show-output

  python-bindings-msrv:
    name: Python Bindings (Rust 1.83)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@1.83.0

      - name: Check Python bindings
        run: cargo check -p evt3-python

  python-tests:
    name: Python Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: ubuntu-latest
            python-version: '3.14t'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Create venv and install dependencies
        working-directory: evt3-python
        run: |
          uv venv --python "${{ steps.python.outputs.python-path }}"
          uv pip install maturin pytest numpy pandas

      - name: Build Python package
        working-directory: evt3-python
        run: |
          source .venv/bin/activate
          maturin develop

      - name: Verify free-threaded import and parallel decoding
        if: matrix.python-version == '3.14t'
        working-directory: evt3-python
        env:
          EVT3_REQUIRE_FREE_THREADED: '1'
        run: |
          source .venv/bin/activate
          pytest tests/test_free_threading.py -v

      - name: Run Python tests (synthetic only)
        working-directory: evt3-python
        run: |
          source .venv/bin/activate
          pytest tests/ -v -k "not TestDecodeFile"
